spring.application.name=medvision-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/medvision
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Configurações de Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-32-characters-long!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
auth.api-key=${AUTH_API_KEY:change-me-in-production}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# TLS - uncomment for direct HTTPS (alternative to nginx proxy)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=app

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
